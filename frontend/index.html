<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF2ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a saved theme before the first paint so dark mode never flashes white
      try {
        var t = localStorage.getItem('cs_theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <meta name="description" content="Countersign 会签: an AI payments agent that can be fooled but can't be robbed." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='%23CF2A1F' stroke-width='3'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23CF2A1F' font-family='sans-serif' font-weight='700'%3E%E4%BC%9A%3C/text%3E%3C/svg%3E" />
    <title>Countersign 会签</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
