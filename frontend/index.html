<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e0c" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a saved theme before the first paint so dark mode never flashes white
      try {
        var t = localStorage.getItem('cs_theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <meta name="description" content="Countersign 会签: AI invoice payments bounded by registered vendors and approved budgets." />
    <!-- ?v= busts the tab-icon cache browsers keep across visits -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Countersign 会签</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
