[project]
name = "countersign-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eth-abi>=6.0.0",
    "eth-utils>=6.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "web3>=7,<8",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
