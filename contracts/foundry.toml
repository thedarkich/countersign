[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "../data" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 128
fail_on_revert = true

[profile.fork]
test = "fork"

[fmt]
line_length = 110
